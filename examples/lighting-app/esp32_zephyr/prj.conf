# Enable CHIP
CONFIG_CHIP=y
CONFIG_CHIP_PROJECT_CONFIG="main/include/CHIPProjectConfig.h"
CONFIG_CHIP_DEVICE_PRODUCT_ID=32773
CONFIG_STD_CPP17=y
CONFIG_CHIP_ENABLE_PAIRING_AUTOSTART=y

# GPIO
CONFIG_GPIO=y

# WiFi for ESP32-C3
CONFIG_WIFI=y
CONFIG_NET_L2_WIFI_MGMT=y
CONFIG_ESP32_WIFI_STA_AUTO_DHCPV4=y
CONFIG_NET_IPV4=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_STATISTICS=y
CONFIG_NET_STATISTICS_WIFI=y
CONFIG_NET_STATISTICS_USER_API=y

# Disable BLE to save DRAM
CONFIG_BT=n

# Disable Thread (C3 has no 802.15.4)
CONFIG_NET_L2_OPENTHREAD=n

# Networking
CONFIG_NETWORKING=y
CONFIG_NET_IPV6=y
CONFIG_NET_IPV6_ND=y
CONFIG_NET_IPV6_NBR_CACHE=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_UDP=y
CONFIG_NET_CONTEXT_RECV_PKTINFO=y
CONFIG_NET_IF_MCAST_IPV6_ADDR_COUNT=6
CONFIG_NET_L2_ETHERNET=y

# POSIX
CONFIG_POSIX_API=y

# ==========================================
# mbedTLS — complete dependency chain for CHIP
# ==========================================
CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_BUILTIN=y
# Ciphers: AES enables AEAD which enables CCM
CONFIG_MBEDTLS_CIPHER_AES_ENABLED=y
CONFIG_MBEDTLS_CIPHER_CCM_ENABLED=y
# Cipher and MD generic layers
CONFIG_MBEDTLS_CIPHER=y
CONFIG_MBEDTLS_MD=y
# Random
CONFIG_MBEDTLS_CTR_DRBG_ENABLED=y
CONFIG_MBEDTLS_ENTROPY_C=y
# ECC
CONFIG_MBEDTLS_ECP_C=y
CONFIG_MBEDTLS_ECP_DP_SECP256R1_ENABLED=y
CONFIG_MBEDTLS_ECDH_C=y
CONFIG_MBEDTLS_ECDSA_C=y
CONFIG_MBEDTLS_ECJPAKE_C=y
# Key derivation
CONFIG_MBEDTLS_HKDF_C=y
CONFIG_MBEDTLS_PKCS5_C=y
# PK and X509
CONFIG_MBEDTLS_PK_WRITE_C=y
CONFIG_MBEDTLS_X509_CSR_WRITE_C=y
# User config adds OID_C, PK_PARSE_C, ASN1_WRITE_C etc needed as prereqs
CONFIG_MBEDTLS_USER_CONFIG_ENABLE=y
CONFIG_MBEDTLS_USER_CONFIG_FILE="mbedtls-config-additions.h"

# ==========================================
# DRAM optimization — ESP32-C3 has only ~306KB
# ==========================================
# Heap — need at least some for CHIP MemoryInit
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=8192
# Reduce mbedTLS heap
CONFIG_MBEDTLS_HEAP_SIZE=4096
# Minimize network buffers
CONFIG_NET_PKT_RX_COUNT=6
CONFIG_NET_PKT_TX_COUNT=6
CONFIG_NET_BUF_RX_COUNT=12
CONFIG_NET_BUF_TX_COUNT=12
# Stack sizes — aggressively reduced
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=1536
CONFIG_ISR_STACK_SIZE=768
# Reduce POSIX fds
CONFIG_POSIX_MAX_FDS=8
# Disable shell
CONFIG_SHELL=n
# Log optimization
CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y
CONFIG_CHIP_LOG_SIZE_OPTIMIZATION=y
# AES ROM tables save RAM
CONFIG_MBEDTLS_AES_ROM_TABLES=y

CONFIG_THREAD_NAME=y
CONFIG_ASSERT=y
# Debug
CONFIG_EXCEPTION_STACK_TRACE=y
CONFIG_BOOT_BANNER=y
CONFIG_PRINTK=y
CONFIG_EARLY_CONSOLE=y
CONFIG_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
